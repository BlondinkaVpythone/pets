<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор возраста питомца</title>
    <!-- Подключение шрифта Courier Prime -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Courier Prime', monospace;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
            background-image: url('фон.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #a4175e;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.8);
            padding: 12px 20px;
            border-radius: 16px;
            display: inline-block;
            color: #a4175e;
        }
        .subtitle {
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: normal;
            background: rgba(255,255,255,0.7);
            padding: 8px 24px;
            border-radius: 20px;
            display: inline-block;
            color: #a4175e;
        }
        .pet-options {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }
        .pet-card {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pet-card:hover {
            transform: scale(1.05);
        }
        .pet-card img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            display: block;
        }
        .pet-card .label {
            font-size: 22px;
            font-weight: bold;
            margin-top: 8px;
            background: rgba(255,255,255,0.7);
            padding: 4px 16px;
            border-radius: 20px;
            color: #a4175e;
        }

        .container {
            background: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: inline-block;
            margin-top: 20px;
        }
        .selected-pet-img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            margin: 0 auto 20px;
            display: block;
        }
        #age-input {
            padding: 14px;
            font-size: 20px;
            width: 140px;
            text-align: center;
            border: 2px solid #a4175e;
            border-radius: 10px;
            margin: 0 10px 20px 10px;
            color: #a4175e;
            font-family: 'Courier Prime', monospace;
        }
        #age-input::placeholder {
            color: rgba(164,23,94,0.6);
        }
        .btn {
            padding: 14px 28px;
            font-size: 20px;
            background: #a4175e;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            font-family: 'Courier Prime', monospace;
        }
        .btn:hover {
            background: #8c0f47;
        }
        .result-text {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            background: rgba(255,255,255,0.8);
            padding: 10px 20px;
            border-radius: 12px;
            color: #a4175e;
        }
        .hidden {
            display: none !important;
        }

        /* Адаптация под мобильные устройства */
       @media (max-width: 480px) {
    body {
        margin: 20px auto;
        padding: 0 10px;
    }
    h1 {
        font-size: 22px;
        padding: 10px 15px;
    }
    .subtitle {
        font-size: 18px;
        padding: 6px 18px;
        margin-bottom: 20px;
    }
    .pet-options {
        gap: 20px;
        margin-bottom: 20px;
    }
    .pet-card img {
        width: 90%;   /* было 130px, стало 160px */
        height: auto;
    }
    .pet-card .label {
        font-size: 18px;
        padding: 2px 12px;
    }
    .container {
        padding: 20px 15px;
    }
    .selected-pet-img {
        width: 90%;   /* было 160px, стало 200px */
        height: auto;
        margin-bottom: 15px;
    }
    #age-input {
        width: 110px;
        font-size: 18px;
        padding: 10px;
        margin: 0 5px 15px 5px;
    }
    .btn {
        padding: 12px 22px;
        font-size: 18px;
    }
    .result-text {
        font-size: 20px;
        padding: 8px 15px;
        margin: 15px 0;
    }
}
    </style>
</head>
<body>
    <h1>Сколько лет вашему питомцу по человеческим меркам?</h1>
    <p class="subtitle" id="choose-text">Выберите питомца</p>

    <!-- Экран выбора -->
    <div id="pet-selection" class="pet-options">
        <div class="pet-card" id="cat-option"
             onclick="selectPet('cat')"
             onmouseenter="document.getElementById('cat-img').src='кошка1.png'"
             onmouseleave="document.getElementById('cat-img').src='кошка.png'">
            <img id="cat-img" src="кошка.png">
            <span class="label">Кошка</span>
        </div>
        <div class="pet-card" id="dog-option"
             onclick="selectPet('dog')"
             onmouseenter="document.getElementById('dog-img').src='собака1.png'"
             onmouseleave="document.getElementById('dog-img').src='собака.png'">
            <img id="dog-img" src="собака.png">
            <span class="label">Собака</span>
        </div>
    </div>

    <!-- Экран ввода возраста -->
    <div id="input-container" class="container hidden">
        <img id="selected-img-input" class="selected-pet-img" src="" alt="Питомец">
        <div class="label" id="selected-pet-name" style="color:#a4175e;"></div>
        <input type="number" id="age-input" placeholder="Возраст" min="0" step="any">
        <br>
        <button class="btn" onclick="calculateAge()">Посчитать</button>
    </div>

    <!-- Экран результата -->
    <div id="result-container" class="container hidden">
        <img id="selected-img-result" class="selected-pet-img">
        <div id="result-text" class="result-text"></div>
        <button class="btn" onclick="resetToSelection()">Заново</button>
    </div>

    <script>
        let chosenPet = null;

        function selectPet(pet) {
            chosenPet = pet;
            const imgSrc = pet === 'cat' ? 'кошка.png' : 'собака.png';
            document.getElementById('selected-img-input').src = imgSrc;
            document.getElementById('selected-img-result').src = imgSrc; // временно, пока не рассчитали
            document.getElementById('selected-pet-name').textContent = pet === 'cat' ? 'Кошка' : 'Собака';

            document.getElementById('choose-text').classList.add('hidden');
            document.getElementById('pet-selection').classList.add('hidden');
            document.getElementById('input-container').classList.remove('hidden');
            document.getElementById('result-container').classList.add('hidden');

            document.getElementById('age-input').value = '';
        }

        // Функция, возвращающая нужную картинку человека по полу и возрасту
        function getHumanImage(pet, humanAge) {
            const isFemale = (pet === 'cat');
            if (humanAge < 7) {
                return isFemale ? 'малышка.png' : 'малыш.png';
            } else if (humanAge < 14) {
                return isFemale ? 'девочка.png' : 'мальчик.png';
            } else if (humanAge < 21) {
                return isFemale ? 'дподросток.png' : 'подросток.png';
            } else if (humanAge < 35) {
                return isFemale ? 'взрослая.png' : 'взрослый.png';
            } else if (humanAge < 55) {
                return isFemale ? 'взрослая1.png' : 'взрослый1.png';
            } else {
                return isFemale ? 'бабушка.png' : 'дедушка.png';
            }
        }

        function calculateAge() {
            const resultElement = document.getElementById('result-text');
            const ageInput = document.getElementById('age-input');
            const ageText = ageInput.value.trim().replace(',', '.');

            if (!chosenPet) {
                resultElement.textContent = 'Сначала выберите питомца.';
                return;
            }
            if (ageText === '') {
                resultElement.textContent = 'Введите возраст.';
                return;
            }
            const age = parseFloat(ageText);
            if (isNaN(age) || age < 0) {
                resultElement.textContent = 'Пожалуйста, введите корректный возраст (0 или больше).';
                return;
            }

            let humanAge;
            if (age === 0) {
                humanAge = 0;
            } else if (age <= 1) {
                humanAge = age * 15;
            } else if (age <= 2) {
                humanAge = 15 + (age - 1) * 9;
            } else {
                const multiplier = chosenPet === 'cat' ? 4 : 5;
                humanAge = 24 + (age - 2) * multiplier;
            }

            humanAge = Math.round(humanAge);

            // Устанавливаем картинку человека в зависимости от возраста
            const humanImg = getHumanImage(chosenPet, humanAge);
            document.getElementById('selected-img-result').src = humanImg;

            // Выводим текст с переносом строки
            resultElement.innerHTML = `Человеческий возраст:<br>${humanAge} лет.`;

            document.getElementById('input-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
        }

        function resetToSelection() {
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('input-container').classList.add('hidden');
            document.getElementById('pet-selection').classList.remove('hidden');
            document.getElementById('choose-text').classList.remove('hidden');
            chosenPet = null;
            document.getElementById('age-input').value = '';
        }
    </script>
</body>
</html>
