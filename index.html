<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор возраста питомца</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            font-family: 'Courier Prime', monospace;
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
            background-image: url('фон.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #a4175e;
            overflow-x: hidden;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.8);
            padding: 12px 20px;
            border-radius: 16px;
            display: inline-block;
            color: #a4175e;
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: normal;
            background: rgba(255,255,255,0.7);
            padding: 8px 24px;
            border-radius: 20px;
            display: inline-block;
            color: #a4175e;
        }

        .pet-options {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .pet-card {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pet-card:hover {
            transform: scale(1.05);
        }

        .pet-card img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            display: block;
        }

        .pet-card .label {
            font-size: 22px;
            font-weight: bold;
            margin-top: 8px;
            background: rgba(255,255,255,0.7);
            padding: 4px 16px;
            border-radius: 20px;
            color: #a4175e;
        }

        .container {
            background: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: inline-block;
            margin-top: 20px;
            max-width: 100%;
        }

        .selected-pet-img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            margin: 0 auto 20px;
            display: block;
        }

        #selected-pet-name {
            color: #a4175e;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        #age-input {
            padding: 14px;
            font-size: 20px;
            width: 140px;
            text-align: center;
            border: 2px solid #a4175e;
            border-radius: 10px;
            margin: 0 10px 20px;
            color: #a4175e;
            font-family: 'Courier Prime', monospace;
        }

        #age-input::placeholder {
            color: rgba(164,23,94,0.6);
        }

        .btn {
            padding: 14px 28px;
            font-size: 20px;
            background: #a4175e;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            font-family: 'Courier Prime', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            background: #8c0f47;
        }

        .result-text {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            background: rgba(255,255,255,0.8);
            padding: 10px 20px;
            border-radius: 12px;
            color: #a4175e;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            body {
                max-width: none;
                min-height: 100svh;
                margin: 0;
                padding: 16px 12px 24px;
                background-attachment: scroll;
                background-size: cover;
                background-position: center top;
            }

            h1 {
                font-size: clamp(21px, 5.6vw, 26px);
                line-height: 1.15;
                display: inline-block;
                max-width: 325px;
                background: rgba(255,255,255,0.82);
                padding: 10px 14px;
                margin: 26px auto 14px;
                border-radius: 12px;
            }

            .subtitle {
                font-size: clamp(14px, 3.8vw, 18px);
                display: inline-block;
                background: rgba(255,255,255,0.72);
                padding: 5px 16px;
                margin: 0 0 18px;
                border-radius: 20px;
            }

            .pet-options {
                flex-direction: row;
                justify-content: center;
                align-items: flex-start;
                gap: 18px;
                margin-bottom: 20px;
                flex-wrap: nowrap;
            }

            .pet-card {
                transition: none;
            }

            .pet-card:hover {
                transform: none;
            }

            .pet-card:active {
                transform: scale(0.98);
            }

            .pet-card img {
                width: min(34vw, 145px);
                height: min(34vw, 145px);
            }

            .pet-card .label {
                font-size: clamp(14px, 4vw, 18px);
                margin-top: 4px;
                padding: 4px 12px;
            }

            .container {
                display: block;
                width: 100%;
                max-width: 325px;
                margin: 18px auto 0;
                padding: 20px 14px;
            }

            .selected-pet-img {
                width: min(56vw, 210px);
                height: min(56vw, 210px);
                margin-bottom: 16px;
            }

            #selected-pet-name {
                font-size: 20px;
            }

            #age-input {
                width: 100%;
                max-width: 250px;
                font-size: 20px;
                padding: 14px;
                margin: 8px auto 16px;
                display: block;
            }

            .btn {
                width: 100%;
                max-width: 250px;
                padding: 14px 22px;
                font-size: 20px;
                margin: 8px auto;
                display: block;
            }

            .btn:hover {
                background: #a4175e;
            }

            .result-text {
                font-size: clamp(20px, 6vw, 24px);
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <h1>Сколько лет вашему питомцу по человеческим меркам?</h1>
    <p class="subtitle" id="choose-text">Выберите питомца</p>

    <div id="pet-selection" class="pet-options">
        <div class="pet-card" id="cat-option"
             onclick="selectPet('cat')"
             onmouseenter="changePetImage('cat-img', 'кошка1.png')"
             onmouseleave="changePetImage('cat-img', 'кошка.png')">
            <img id="cat-img" src="кошка.png" alt="Кошка">
            <span class="label">Кошка</span>
        </div>
        <div class="pet-card" id="dog-option"
             onclick="selectPet('dog')"
             onmouseenter="changePetImage('dog-img', 'собака1.png')"
             onmouseleave="changePetImage('dog-img', 'собака.png')">
            <img id="dog-img" src="собака.png" alt="Собака">
            <span class="label">Собака</span>
        </div>
    </div>

    <div id="input-container" class="container hidden">
        <img id="selected-img-input" class="selected-pet-img" src="" alt="Питомец">
        <div id="selected-pet-name"></div>
        <input type="number" id="age-input" placeholder="Возраст" min="0" step="any">
        <button class="btn" onclick="calculateAge()">Посчитать</button>
    </div>

    <div id="result-container" class="container hidden">
        <img id="selected-img-result" class="selected-pet-img" src="" alt="Результат">
        <div id="result-text" class="result-text"></div>
        <button class="btn" onclick="resetToSelection()">Заново</button>
    </div>

    <script>
        let chosenPet = null;
        const isTouchDevice = window.matchMedia('(hover: none)').matches;

        function changePetImage(id, src) {
            if (!isTouchDevice) {
                document.getElementById(id).src = src;
            }
        }

        function selectPet(pet) {
            chosenPet = pet;

            const imgSrc = pet === 'cat' ? 'кошка.png' : 'собака.png';
            const petName = pet === 'cat' ? 'Кошка' : 'Собака';

            document.getElementById('selected-img-input').src = imgSrc;
            document.getElementById('selected-img-result').src = imgSrc;
            document.getElementById('selected-pet-name').textContent = petName;

            document.getElementById('choose-text').classList.add('hidden');
            document.getElementById('pet-selection').classList.add('hidden');
            document.getElementById('input-container').classList.remove('hidden');
            document.getElementById('result-container').classList.add('hidden');

            document.getElementById('age-input').value = '';
        }

        function getHumanImage(pet, humanAge) {
            const isFemale = pet === 'cat';

            if (humanAge < 7) {
                return isFemale ? 'малышка.png' : 'малыш.png';
            }

            if (humanAge < 14) {
                return isFemale ? 'девочка.png' : 'мальчик.png';
            }

            if (humanAge < 21) {
                return isFemale ? 'дподросток.png' : 'подросток.png';
            }

            if (humanAge < 35) {
                return isFemale ? 'взрослая.png' : 'взрослый.png';
            }

            if (humanAge < 55) {
                return isFemale ? 'взрослая1.png' : 'взрослый1.png';
            }

            return isFemale ? 'бабушка.png' : 'дедушка.png';
        }

        function calculateAge() {
            const resultElement = document.getElementById('result-text');
            const ageInput = document.getElementById('age-input');
            const ageText = ageInput.value.trim().replace(',', '.');

            if (!chosenPet) {
                resultElement.textContent = 'Сначала выберите питомца.';
                return;
            }

            if (ageText === '') {
                resultElement.textContent = 'Введите возраст.';
                return;
            }

            const age = parseFloat(ageText);

            if (isNaN(age) || age < 0) {
                resultElement.textContent = 'Пожалуйста, введите корректный возраст (0 или больше).';
                return;
            }

            let humanAge;

            if (age === 0) {
                humanAge = 0;
            } else if (age <= 1) {
                humanAge = age * 15;
            } else if (age <= 2) {
                humanAge = 15 + (age - 1) * 9;
            } else {
                const multiplier = chosenPet === 'cat' ? 4 : 5;
                humanAge = 24 + (age - 2) * multiplier;
            }

            humanAge = Math.round(humanAge);

            document.getElementById('selected-img-result').src = getHumanImage(chosenPet, humanAge);
            resultElement.innerHTML = `Человеческий возраст:<br>${humanAge} лет.`;

            document.getElementById('input-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
        }

        function resetToSelection() {
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('input-container').classList.add('hidden');
            document.getElementById('pet-selection').classList.remove('hidden');
            document.getElementById('choose-text').classList.remove('hidden');

            chosenPet = null;
            document.getElementById('age-input').value = '';
        }
    </script>
</body>
</html>
